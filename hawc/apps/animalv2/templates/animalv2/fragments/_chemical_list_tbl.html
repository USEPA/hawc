{% if object_list or obj_perms.edit %}
  <h3>Animal bioassay chemicals</h3>
  <table class="table table-sm table-striped">
    {% bs4_colgroup '50,50' %}
    {% bs4_thead 'Name,DTXSID' %}
    <tbody>
      {% for object in object_list %}
        <tr>
          <td><a href="{% url 'animalv2:chemical_detail' object.pk %}">{{object}}</a></td>
          <td>{{object.dtxsid}}</td>
        </tr>
      {% empty %}
        {% bs4_fullrow 'No chemicals available.' %}
      {% endfor %}
    </tbody>
  </table>
{% endif %}
