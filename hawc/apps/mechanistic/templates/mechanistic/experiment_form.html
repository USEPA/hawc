{% extends 'assessment-rooted.html' %}

{% block content %}
  <div class="d-flex justify-content-end">
    {% include "common/scientific_pulldown.html" %}
  </div>
  {% crispy form %}
{% endblock %}

{% block extrajs %}
  <script type="text/javascript">
	  // note - this only fires during initial experiment creation.
	  // when editing an existing experiment it's a different flow.
	  //
	  // put common stuff into frontend/mechanistic/form.js

    $(document).ready(function() {
      window.app.startup("mechanisticStartup", function(app){
          app.formStartup(document);
      });
    });
  </script>
{% endblock extrajs %}
